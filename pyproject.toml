[project]
name = "phi"
version = "0.2.0"
description = "PHI — research-grade platform for falsifiable evaluation of Golden Ratio / Fibonacci features in financial markets"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — see repository owner" }
authors = [{ name = "Dhanush Aleti" }]

# Runtime dependencies are pinned via uv.lock for reproducibility (PRD-REPRO-004).
# Kept intentionally small (PRD-NFR-006: no premature infrastructure). Notably we
# do NOT depend on pyarrow (Polars reads/writes Parquet natively) or scipy (the
# specific statistics PHI needs are implemented on numpy in phi.validation.stats).
dependencies = [
    "polars>=1.0,<2.0",      # primary dataframe engine (SYSTEM_ARCHITECTURE §29)
    "numpy>=1.26,<3.0",      # numerics + the statistics backing validation
    "pydantic>=2.6,<3.0",    # schema / config validation at boundaries
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",     # property/invariant tests
    "ruff>=0.6",             # lint + format
    "mypy>=1.10",            # static typing on scientifically-critical modules
]

[project.scripts]
phi = "phi.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phi"]

# ---------------------------------------------------------------------------
# Tooling configuration
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "unit: fast isolated unit tests",
    "integration: cross-module integration tests",
    "leakage: scientific look-ahead / leakage invariant tests",
    "reproducibility: deterministic reproducibility tests",
    "slow: longer-running end-to-end tests",
]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "PL", "RUF"]
ignore = [
    "PLR2004",  # magic values — noisy in scientific/test code
    "PLR0913",  # many args — common for scientific config objects
    "PLW0603",  # global for one-time idempotent module configuration (logging setup)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "N802", "N803", "N806"]
# Category names (f_A, f_C1, f_C2, ...) mirror the frozen contract's own
# notation (docs/05-mathematics/phi-retracement-feature-contract.md §3, §7)
# verbatim, for one-to-one traceability between spec and implementation.
"src/phi/features/**" = ["N802"]

[tool.mypy]
# Set to the actual development interpreter (3.13, per `uv run python --version`)
# rather than the `requires-python` floor (3.11): numpy's bundled stub files use
# PEP 695 `type` syntax that mypy can only parse under python_version >= 3.12,
# and pinning below that breaks type-checking entirely rather than checking
# 3.11 compatibility (mypy does not detect accidental 3.12+-only syntax in this
# codebase either way, since none is deliberately used).
python_version = "3.13"
# Strict where it matters; scientific correctness benefits most from typing.
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
files = ["src/phi"]

[[tool.mypy.overrides]]
module = ["polars.*", "scipy.*", "pyarrow.*", "numpy.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/phi"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
